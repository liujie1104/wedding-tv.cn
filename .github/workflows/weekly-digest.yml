name: Publish Weekly Wedding Digest

on:
  # No scheduled filler: only manually reviewed, fresh news drafts may publish.
  workflow_dispatch:
    inputs:
      issue:
        description: '已审阅热点稿件的期数（没有稿件则跳过，不凑刊）'
        required: false
        type: string
      date:
        description: '指定发布日期 YYYY-MM-DD（留空则默认当天）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check reviewed news and generate only when eligible
        id: generate
        env:
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          ARGS=()
          if [ -n "$INPUT_ISSUE" ]; then ARGS+=(--issue "$INPUT_ISSUE"); fi
          if [ -n "$INPUT_DATE" ]; then ARGS+=(--date "$INPUT_DATE"); fi
          python scripts/generate_weekly_digest.py "${ARGS[@]}"

      - name: Test weekly publication gates
        run: python -m unittest discover -s scripts -p 'test_weekly_*.py' -v

      - name: Verify Static Content Audit
        run: node scripts/audit-static-content.cjs

      - name: Run Regression Tests
        run: node --test scripts/test-api-regressions.mjs

      - name: Commit and Push New Issue
        if: steps.generate.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(weekly): publish reviewed wedding news digest"
            git push origin main
          fi

      - name: Render Xiaohongshu & Social Copy to Job Summary
        if: success() && steps.generate.outputs.published == 'true'
        run: |
          if [ -f "latest-social-copy.md" ]; then
            cat latest-social-copy.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Report skipped issue
        if: success() && steps.generate.outputs.published != 'true'
        run: echo "No eligible new wedding news. No issue, promotion or commit was created." >> "$GITHUB_STEP_SUMMARY"
