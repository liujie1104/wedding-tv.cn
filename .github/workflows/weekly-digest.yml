name: Publish Weekly Wedding Digest

on:
  # 定时自动发布已暂停，避免模板兜底产生重复内容；新刊编撰入库后通过手动触发发布
  workflow_dispatch:
    inputs:
      issue:
        description: '指定发布的周刊期数（留空则自动顺延下一期）'
        required: false
        type: string
      date:
        description: '指定发布日期 YYYY-MM-DD（留空则默认当天）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate New Weekly Digest Issue
        env:
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          ARGS=""
          if [ -n "$INPUT_ISSUE" ]; then ARGS="$ARGS --issue $INPUT_ISSUE"; fi
          if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --date $INPUT_DATE"; fi
          python scripts/generate_weekly_digest.py $ARGS

      - name: Verify Static Content Audit
        run: node scripts/audit-static-content.cjs

      - name: Run Regression Tests
        run: node --test scripts/test-api-regressions.mjs

      - name: Commit and Push New Issue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat(weekly): publish new weekly wedding digest issue automatically"
            git push origin main
          fi

      - name: Render Xiaohongshu & Social Copy to Job Summary
        if: always()
        run: |
          if [ -f "latest-social-copy.md" ]; then
            cat latest-social-copy.md >> $GITHUB_STEP_SUMMARY
          fi
