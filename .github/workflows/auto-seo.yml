name: Validate and Submit Sitemap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'blog/**'
      - 'functions/**'
      - 'scripts/**'
      - 'src/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'ads.txt'
      - 'sw.js'
      - 'manifest.json'
      - 'wrangler.jsonc'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'blog/**'
      - 'functions/**'
      - 'scripts/**'
      - 'src/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'ads.txt'
      - 'sw.js'
      - 'manifest.json'
      - 'wrangler.jsonc'
      - '.github/workflows/**'

permissions:
  contents: read
  checks: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Worker and Functions syntax
        run: node --input-type=module --eval "import('./src/worker.js')"
      - name: Validate Wrangler deployment configuration
        run: npx --yes wrangler@4.128.0 deploy --dry-run --outdir /tmp/wrangler-dry-run
      - name: Run API regression tests
        run: node --test scripts/test-api-regressions.mjs
      - name: Audit indexed content
        run: node scripts/audit-static-content.cjs

  submit-indexnow:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Wait for successful Cloudflare deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_CHECK_NAME: "Workers Builds: wedding-tv"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            CHECKS=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs")
            STATUS=$(jq -r --arg name "$CLOUDFLARE_CHECK_NAME" '[.check_runs[] | select(.name == $name)][0].status // ""' <<<"$CHECKS")
            CONCLUSION=$(jq -r --arg name "$CLOUDFLARE_CHECK_NAME" '[.check_runs[] | select(.name == $name)][0].conclusion // ""' <<<"$CHECKS")

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Cloudflare deployment completed successfully."
                break
              fi
              echo "Cloudflare deployment completed with conclusion: ${CONCLUSION:-unknown}" >&2
              exit 1
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "Timed out waiting for Cloudflare deployment check: $CLOUDFLARE_CHECK_NAME" >&2
              exit 1
            fi
            sleep 15
          done

      - name: Verify deployed sitemap matches this commit
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            curl --fail --silent --show-error \
              -H "Cache-Control: no-cache" \
              "https://wedding-tv.cn/sitemap.xml?deployment=${GITHUB_SHA}&attempt=${attempt}" \
              --output live-sitemap.xml
            if cmp --silent sitemap.xml live-sitemap.xml; then
              echo "The live sitemap matches this commit."
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "The live sitemap did not match this commit after 10 minutes." >&2
              exit 1
            fi
            sleep 15
          done

      - name: Extract URLs from sitemap
        id: urls
        run: |
          grep -oP '(?<=<loc>)[^<]+' sitemap.xml > urls.txt
          echo "count=$(wc -l < urls.txt)" >> "$GITHUB_OUTPUT"

      - name: Submit to IndexNow
        run: |
          KEY=$(cat .indexnow-key)
          URLS_JSON=$(jq -R . urls.txt | jq -s .)
          PAYLOAD=$(jq -n \
            --arg host "wedding-tv.cn" \
            --arg key "$KEY" \
            --arg keyLoc "https://wedding-tv.cn/${KEY}.txt" \
            --argjson urls "$URLS_JSON" \
            '{host: $host, key: $key, keyLocation: $keyLoc, urlList: $urls}')
          curl --fail-with-body -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD"

      - name: Submit to Baidu when configured
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          if [ -z "$BAIDU_PUSH_TOKEN" ]; then
            echo "BAIDU_PUSH_TOKEN is not configured; skipping."
            exit 0
          fi
          curl --fail-with-body -X POST "https://data.zz.baidu.com/urls?site=https://wedding-tv.cn&token=${BAIDU_PUSH_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data-binary @urls.txt

      - name: Summary
        run: |
          echo "### Sitemap validation and submission complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validated indexed pages before submission" >> "$GITHUB_STEP_SUMMARY"
          echo "- Submitted ${{ steps.urls.outputs.count }} URLs to IndexNow" >> "$GITHUB_STEP_SUMMARY"
