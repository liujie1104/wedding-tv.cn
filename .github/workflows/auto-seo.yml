name: Validate and Submit Sitemap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'blog/**'
      - 'functions/**'
      - 'scripts/**'
      - 'src/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'sw.js'
      - 'wrangler.jsonc'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit indexed content
        run: node scripts/audit-static-content.js

  submit-indexnow:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v5

      - name: Extract URLs from sitemap
        id: urls
        run: |
          grep -oP '(?<=<loc>)[^<]+' sitemap.xml > urls.txt
          echo "count=$(wc -l < urls.txt)" >> "$GITHUB_OUTPUT"

      - name: Submit to IndexNow
        run: |
          KEY=$(cat .indexnow-key)
          URLS_JSON=$(jq -R . urls.txt | jq -s .)
          PAYLOAD=$(jq -n \
            --arg host "wedding-tv.cn" \
            --arg key "$KEY" \
            --arg keyLoc "https://wedding-tv.cn/${KEY}.txt" \
            --argjson urls "$URLS_JSON" \
            '{host: $host, key: $key, keyLocation: $keyLoc, urlList: $urls}')
          curl --fail-with-body -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD"

      - name: Submit to Baidu when configured
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          if [ -z "$BAIDU_PUSH_TOKEN" ]; then
            echo "BAIDU_PUSH_TOKEN is not configured; skipping."
            exit 0
          fi
          curl --fail-with-body -X POST "https://data.zz.baidu.com/urls?site=https://wedding-tv.cn&token=${BAIDU_PUSH_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data-binary @urls.txt

      - name: Summary
        run: |
          echo "### Sitemap validation and submission complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validated indexed pages before submission" >> "$GITHUB_STEP_SUMMARY"
          echo "- Submitted ${{ steps.urls.outputs.count }} URLs to IndexNow" >> "$GITHUB_STEP_SUMMARY"
