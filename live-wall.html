<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>婚礼大屏互动系统 · 微信扫码弹幕签到与现场抽奖</title>
<meta name="description" content="免费婚礼大屏互动软件，支持酒店LED投屏、微信扫码发送弹幕、大屏祝福墙、现场照片滚动与幸运抽奖，支持自定义新人姓名、欢迎语与自定义背景图。" />
<link rel="canonical" href="https://wedding-tv.cn/live-wall.html" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6560247681968502" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
:root {
  --gold: #ffd28a;
  --rose: #ff6b9d;
  --bg-dark: #0e0a14;
  --panel: rgba(23, 17, 33, 0.88);
  --line: rgba(255, 210, 138, 0.25);
  --text: #f7f3ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html {
  width: 100%; height: 100%; overflow: hidden;
  background: #09060d; color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  user-select: none;
}

/* 背景层 */
#screenBg {
  position: fixed; inset: 0; z-index: 0;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  transition: background 0.5s ease;
}
#particleCanvas {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
}

/* 顶部大屏标题栏 */
.top-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  padding: 24px 40px;
  display: flex; justify-content: space-between; align-items: flex-start;
  background: linear-gradient(180deg, rgba(14,10,20,0.85) 0%, rgba(14,10,20,0) 100%);
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}
.header-main h1 {
  font-size: 38px; font-weight: 800; color: var(--gold);
  letter-spacing: 2px; display: flex; align-items: center; gap: 14px;
}
.header-main .subtitle {
  font-size: 18px; color: #e2d9eb; margin-top: 6px; font-weight: 500;
}
.header-meta {
  text-align: right; font-size: 15px; color: var(--gold);
}
.header-meta .date { font-size: 20px; font-weight: 700; color: #fff; }

/* 弹幕主容器 */
#danmakuContainer {
  position: fixed; inset: 120px 0 100px 0; z-index: 5;
  overflow: hidden; pointer-events: none;
}
.danmaku-item {
  position: absolute; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 10px;
  padding: 8px 20px; border-radius: 999px;
  font-size: 24px; font-weight: 700;
  box-shadow: 0 4px 18px rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  will-change: transform;
}
.danmaku-item .badge {
  font-size: 14px; padding: 3px 10px; border-radius: 999px;
  background: rgba(0,0,0,0.3); font-weight: 600;
}

/* 颜色风格 */
.dm-gold { background: rgba(36, 26, 15, 0.85); color: #ffe2b3; border: 1.5px solid #ffd28a; }
.dm-rose { background: rgba(43, 18, 29, 0.85); color: #ffd6e4; border: 1.5px solid #ff6b9d; }
.dm-purple { background: rgba(28, 18, 48, 0.85); color: #e9d5ff; border: 1.5px solid #c4b5fd; }
.dm-red { background: rgba(50, 12, 18, 0.85); color: #ffe4e6; border: 1.5px solid #f43f5e; }

/* 右下角扫码区域 */
.qr-corner {
  position: fixed; right: 30px; bottom: 25px; z-index: 20;
  background: rgba(23, 17, 33, 0.92); border: 2px solid var(--gold);
  border-radius: 16px; padding: 14px 18px; text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  display: flex; align-items: center; gap: 14px;
}
.qr-corner canvas {
  width: 100px; height: 100px; border-radius: 8px; background: #fff; padding: 4px;
}
.qr-info h4 { font-size: 16px; color: var(--gold); margin-bottom: 4px; font-weight: 700; }
.qr-info p { font-size: 12px; color: #b9aed1; }

/* 底部操作控制条 */
.control-bar {
  position: fixed; bottom: 25px; left: 30px; z-index: 20;
  display: flex; gap: 10px;
}
.ctrl-btn {
  background: rgba(23, 17, 33, 0.85); border: 1px solid var(--line);
  color: var(--text); padding: 10px 18px; border-radius: 999px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  backdrop-filter: blur(8px); transition: all 0.2s;
}
.ctrl-btn:hover, .ctrl-btn.active {
  border-color: var(--gold); color: var(--gold); background: rgba(35, 25, 50, 0.95);
  box-shadow: 0 0 12px rgba(255,210,138,0.3);
}

/* 抽奖弹窗模式 */
#lotteryModal {
  display: none; position: fixed; inset: 0; z-index: 50;
  background: rgba(10,6,15,0.92); backdrop-filter: blur(12px);
  align-items: center; justify-content: center; flex-direction: column;
}
.lottery-box {
  width: 580px; background: #171121; border: 2px solid var(--gold);
  border-radius: 24px; padding: 36px; text-align: center;
  box-shadow: 0 15px 50px rgba(0,0,0,0.9);
}
.roller-card {
  height: 120px; background: #0e0a14; border: 1px solid var(--line);
  border-radius: 16px; margin: 24px 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 42px; font-weight: 800; color: var(--gold);
}
.lottery-winners {
  margin-top: 20px; max-height: 140px; overflow-y: auto; text-align: left;
  background: #0e0a14; border-radius: 10px; padding: 12px; font-size: 14px;
}

/* 设置抽屉 */
#settingsDrawer {
  position: fixed; top: 0; left: -420px; bottom: 0; width: 400px; z-index: 100;
  background: #171121; border-right: 1px solid var(--line);
  box-shadow: 10px 0 40px rgba(0,0,0,0.8);
  padding: 30px 24px; overflow-y: auto;
  transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
#settingsDrawer.open { left: 0; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 13px; color: var(--gold); margin-bottom: 6px; font-weight: 600; }
.form-group input, .form-group select {
  width: 100%; padding: 10px 14px; background: #0e0a14; border: 1px solid var(--line);
  border-radius: 8px; color: #fff; font-size: 14px; outline: none;
}
.form-group input:focus { border-color: var(--gold); }
.preset-bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.preset-bg-btn {
  padding: 12px 6px; border-radius: 8px; border: 1px solid var(--line);
  background: #0e0a14; color: #e2d9eb; font-size: 12px; cursor: pointer; text-align: center;
}
.preset-bg-btn.active { border-color: var(--gold); color: var(--gold); background: #261933; }
</style>
</head>
<body>

<!-- 动态背景 -->
<div id="screenBg"></div>
<canvas id="particleCanvas"></canvas>

<!-- 顶部大屏标题 -->
<header class="top-header">
  <div class="header-main">
    <h1 id="dispTitle">🤵 <span id="dispGroom">张明</span> & 👰 <span id="dispBride">李婷</span> · 婚礼互动大屏</h1>
    <div class="subtitle" id="dispSubtitle">欢迎各位亲朋好友莅临见证 · 微信扫码发弹幕送祝福</div>
  </div>
  <div class="header-meta">
    <div class="date" id="dispDate">2026.08.28</div>
    <div id="dispVenue">喜来登大酒店 · 凡尔赛宴会厅</div>
  </div>
</header>

<!-- 弹幕飞行主轨道 -->
<div id="danmakuContainer"></div>

<!-- 右下角常驻互动二维码 -->
<div class="qr-corner" id="qrBox">
  <canvas id="qrCanvas"></canvas>
  <div class="qr-info">
    <h4>📱 微信扫码</h4>
    <p>现场发弹幕 / 签到</p>
    <p style="color:var(--rose);margin-top:2px;">实时上大屏</p>
  </div>
</div>

<!-- 底部控制按钮 -->
<div class="control-bar">
  <button class="ctrl-btn" id="btnSettings">⚙️ 大屏设置 (S)</button>
  <button class="ctrl-btn" id="btnDemo">🎲 模拟弹幕</button>
  <button class="ctrl-btn" id="btnLottery">🎁 现场抽奖</button>
  <button class="ctrl-btn" id="btnFullscreen">🖥️ 全屏展示 (F11)</button>
  <button class="ctrl-btn" id="btnClear">🧹 清屏</button>
</div>

<!-- 抽奖弹窗 -->
<div id="lotteryModal">
  <div class="lottery-box">
    <h2 style="color:var(--gold);font-size:28px;">🎁 现场大屏幸运抽奖</h2>
    <p style="color:#b9aed1;font-size:14px;margin-top:6px;">从所有扫码发送祝福的宾客中随机抽取</p>
    <div class="roller-card" id="lotteryRoller">准备抽奖...</div>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button class="ctrl-btn active" id="btnStartLottery" style="padding:12px 32px;font-size:16px;">▶️ 开始滚动 (空格)</button>
      <button class="ctrl-btn" id="btnCloseLottery" style="padding:12px 24px;">✕ 关闭</button>
    </div>
    <div class="lottery-winners" id="lotteryWinnerList">中奖名单：暂无</div>
  </div>
</div>

<!-- 设置侧边栏 -->
<div id="settingsDrawer">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
    <h3 style="color:var(--gold);font-size:18px;">⚙️ 婚礼大屏设置</h3>
    <button id="btnCloseSettings" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;">✕</button>
  </div>

  <div class="form-group">
    <label>房间代号 (Room ID)</label>
    <input type="text" id="cfgRoom" value="wedding888" placeholder="用于宾客扫码关联" />
  </div>

  <div class="form-group">
    <label>新人姓名</label>
    <div style="display:flex;gap:8px;">
      <input type="text" id="cfgGroom" placeholder="新郎" value="张明" />
      <input type="text" id="cfgBride" placeholder="新娘" value="李婷" />
    </div>
  </div>

  <div class="form-group">
    <label>主标题 & 欢迎副标题</label>
    <input type="text" id="cfgTitle" value="婚礼现场大屏互动" style="margin-bottom:8px;" />
    <input type="text" id="cfgSubtitle" value="欢迎各位亲朋好友莅临见证 · 微信扫码发弹幕送祝福" />
  </div>

  <div class="form-group">
    <label>婚期 & 宴会场地</label>
    <input type="text" id="cfgDate" value="2026.08.28" style="margin-bottom:8px;" />
    <input type="text" id="cfgVenue" value="喜来登大酒店 · 凡尔赛宴会厅" />
  </div>

  <div class="form-group">
    <label>大屏背景主题</label>
    <div class="preset-bg-grid">
      <div class="preset-bg-btn active" data-bg="midnight">🌌 星河黑金</div>
      <div class="preset-bg-btn" data-bg="rose">🌸 浪漫樱粉</div>
      <div class="preset-bg-btn" data-bg="champagne">✨ 香槟优雅</div>
    </div>
  </div>

  <div class="form-group">
    <label>🖼️ 自定义上传大屏背景图 (婚纱照/现场海报)</label>
    <input type="file" id="cfgCustomBg" accept="image/*" />
    <small style="color:#b9aed1;font-size:11px;display:block;margin-top:4px;">支持高清横版 16:9 婚纱照或酒店背景图</small>
  </div>

  <div class="form-group">
    <label>弹幕飞行速度</label>
    <select id="cfgSpeed">
      <option value="12">慢速（从容悠闲）</option>
      <option value="8" selected>中速（标准推荐）</option>
      <option value="5">快速（欢快热闹）</option>
    </select>
  </div>

  <button class="ctrl-btn active" id="btnSaveCfg" style="width:100%;justify-content:center;margin-top:14px;padding:12px;">💾 保存并应用设置</button>
</div>

<script>
const $ = id => document.getElementById(id);

// 状态与配置
let config = {
  room: "wedding888",
  groom: "张明",
  bride: "李婷",
  title: "婚礼现场大屏互动",
  subtitle: "欢迎各位亲朋好友莅临见证 · 微信扫码发弹幕送祝福",
  date: "2026.08.28",
  venue: "喜来登大酒店 · 凡尔赛宴会厅",
  bgTheme: "midnight",
  customBgUrl: "",
  speed: 8
};

// 预设背景
const BG_PRESETS = {
  midnight: "radial-gradient(circle at center, #261633 0%, #150d1e 60%, #09060d 100%)",
  rose: "radial-gradient(circle at center, #3d1727 0%, #240c17 60%, #12050b 100%)",
  champagne: "radial-gradient(circle at center, #302414 0%, #1f160b 60%, #0d0904 100%)"
};

// 本地存储同步
try {
  const saved = localStorage.getItem("wedding_wall_cfg");
  if (saved) config = { ...config, ...JSON.parse(saved) };
} catch(e){}

function applyConfig() {
  $("dispGroom").textContent = config.groom;
  $("dispBride").textContent = config.bride;
  $("dispTitle").innerHTML = `🤵 <span>${config.groom}</span> & 👰 <span>${config.bride}</span> · ${config.title}`;
  $("dispSubtitle").textContent = config.subtitle;
  $("dispDate").textContent = config.date;
  $("dispVenue").textContent = config.venue;

  // 背景
  if (config.customBgUrl) {
    $("screenBg").style.background = `linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url("${config.customBgUrl}") center/cover no-repeat`;
  } else {
    $("screenBg").style.background = BG_PRESETS[config.bgTheme] || BG_PRESETS.midnight;
  }

  // 生成二维码
  renderQRCode();
}

function renderQRCode() {
  const joinUrl = `https://wedding-tv.cn/blessing.html?room=${encodeURIComponent(config.room)}&g=${encodeURIComponent(config.groom)}&b=${encodeURIComponent(config.bride)}`;
  if (typeof QRCode !== "undefined") {
    QRCode.toCanvas($("qrCanvas"), joinUrl, {
      width: 100, margin: 0, color: { dark: "#0e0a14", light: "#ffffff" }
    });
  }
}

// 弹幕引擎
const container = $("danmakuContainer");
const trackCount = 6;
let trackLastTime = new Array(trackCount).fill(0);
let guestPool = new Set(["张明", "李婷"]);

function spawnDanmaku(name, identity, message, color = "gold") {
  guestPool.add(name);
  const el = document.createElement("div");
  const colorClass = `dm-${color}` || "dm-gold";
  el.className = `danmaku-item ${colorClass}`;
  el.innerHTML = `<span class="badge">${identity || "现场宾客"} · ${name}</span> <span>${message}</span>`;
  
  // 选择较为空闲的轨道
  const now = Date.now();
  let bestTrack = 0;
  let minTime = Infinity;
  for (let i = 0; i < trackCount; i++) {
    if (trackLastTime[i] < minTime) {
      minTime = trackLastTime[i];
      bestTrack = i;
    }
  }
  trackLastTime[bestTrack] = now + 1600;

  const trackH = container.clientHeight / trackCount;
  const topY = bestTrack * trackH + (trackH * 0.15);
  el.style.top = topY + "px";
  el.style.left = "100vw";
  container.appendChild(el);

  // 动画
  const duration = config.speed * 1000;
  const startTime = performance.now();
  const startX = window.innerWidth;
  const targetX = -el.offsetWidth - 200;

  function animate(t) {
    const elapsed = t - startTime;
    const progress = elapsed / duration;
    if (progress >= 1) {
      el.remove();
    } else {
      const currentX = startX + (targetX - startX) * progress;
      el.style.transform = `translateX(${currentX - startX}px)`;
      requestAnimationFrame(animate);
    }
  }
  requestAnimationFrame(animate);
}

// 实时轮询 / API
let lastTimestamp = Date.now() - 3600000;
async function pollMessages() {
  try {
    const res = await fetch(`/api/wall?room=${encodeURIComponent(config.room)}&since=${lastTimestamp}`);
    const data = await res.json();
    if (data.ok && data.messages && data.messages.length > 0) {
      data.messages.forEach(msg => {
        spawnDanmaku(msg.name, msg.identity, msg.message, msg.color);
        if (msg.ts > lastTimestamp) lastTimestamp = msg.ts;
      });
    }
  } catch(e){}
}
setInterval(pollMessages, 2000);

// 模拟演示弹幕
const DEMO_POOL = [
  { name: "王伟", iden: "大学室友 · 6号桌", text: "祝老铁新婚快乐，百年好合！早生贵子！🎉", col: "gold" },
  { name: "林晓雨", iden: "新娘闺蜜 · 2号桌", text: "最美的新娘！婷婷今天美翻全场，要永远幸福下去呀！❤️", col: "rose" },
  { name: "张叔叔", iden: "长辈亲友 · 1号桌", text: "两姓联姻，一堂缔约，祝新人永结同心，福泽深厚！✨", col: "gold" },
  { name: "刘鹏", iden: "伴郎团 · 8号桌", text: "新郎今晚千万别喝趴下，兄弟们顶得住！🍻", col: "purple" },
  { name: "赵雅婷", iden: "同事好友 · 5号桌", text: "从校园长跑到步入婚姻殿堂，见证神仙爱情，太感动了！😭", col: "rose" },
  { name: "陈浩", iden: "高中同学 · 7号桌", text: "恭喜老同学抱得美人归！喜酒真好喝！🥂", col: "red" }
];

let demoTimer = null;
$("btnDemo").onclick = () => {
  if (demoTimer) {
    clearInterval(demoTimer); demoTimer = null;
    $("btnDemo").textContent = "🎲 模拟弹幕";
    $("btnDemo").classList.remove("active");
  } else {
    $("btnDemo").textContent = "⏹️ 停止模拟";
    $("btnDemo").classList.add("active");
    let idx = 0;
    demoTimer = setInterval(() => {
      const item = DEMO_POOL[idx % DEMO_POOL.length];
      spawnDanmaku(item.name, item.iden, item.text, item.col);
      idx++;
    }, 1800);
  }
};

// 抽奖逻辑
let lotteryRolling = false;
let lotteryInterval = null;
$("btnLottery").onclick = () => { $("lotteryModal").style.display = "flex"; };
$("btnCloseLottery").onclick = () => { $("lotteryModal").style.display = "none"; };

function toggleLottery() {
  const pool = Array.from(guestPool);
  if (pool.length === 0) pool.push("现场贵宾");

  if (!lotteryRolling) {
    lotteryRolling = true;
    $("btnStartLottery").textContent = "⏹️ 停止抽取中奖者";
    lotteryInterval = setInterval(() => {
      const r = pool[Math.floor(Math.random() * pool.length)];
      $("lotteryRoller").textContent = `🎉 ${r} 🎉`;
    }, 60);
  } else {
    lotteryRolling = false;
    clearInterval(lotteryInterval);
    $("btnStartLottery").textContent = "▶️ 再抽一位";
    const winner = $("lotteryRoller").textContent.replace(/🎉/g, "").trim();
    const item = document.createElement("div");
    item.style.padding = "4px 0";
    item.innerHTML = `🏆 <strong style="color:var(--gold)">${winner}</strong> 荣获幸运大礼！ (${new Date().toLocaleTimeString()})`;
    $("lotteryWinnerList").appendChild(item);
  }
}
$("btnStartLottery").onclick = toggleLottery;

// 设置抽屉交互
$("btnSettings").onclick = () => { $("settingsDrawer").classList.add("open"); };
$("btnCloseSettings").onclick = () => { $("settingsDrawer").classList.remove("open"); };

document.querySelectorAll(".preset-bg-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".preset-bg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    config.bgTheme = btn.dataset.bg;
    config.customBgUrl = ""; // 重置自定义图片
  };
});

$("cfgCustomBg").onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = (evt) => {
      config.customBgUrl = evt.target.result;
      document.querySelectorAll(".preset-bg-btn").forEach(b => b.classList.remove("active"));
    };
    reader.readAsDataURL(file);
  }
};

$("btnSaveCfg").onclick = () => {
  config.room = $("cfgRoom").value.trim() || "wedding888";
  config.groom = $("cfgGroom").value.trim() || "新郎";
  config.bride = $("cfgBride").value.trim() || "新娘";
  config.title = $("cfgTitle").value.trim() || "婚礼现场大屏互动";
  config.subtitle = $("cfgSubtitle").value.trim();
  config.date = $("cfgDate").value.trim();
  config.venue = $("cfgVenue").value.trim();
  config.speed = Number($("cfgSpeed").value) || 8;

  try { localStorage.setItem("wedding_wall_cfg", JSON.stringify(config)); } catch(e){}
  applyConfig();
  $("settingsDrawer").classList.remove("open");
};

// 全屏与清屏
$("btnFullscreen").onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
};
$("btnClear").onclick = () => { container.innerHTML = ""; };

// 快捷键支持
window.addEventListener("keydown", (e) => {
  if (e.key === "s" || e.key === "S") $("settingsDrawer").classList.toggle("open");
  if (e.key === " " && $("lotteryModal").style.display === "flex") {
    e.preventDefault(); toggleLottery();
  }
});

// 星空粒子背景
const canvas = $("particleCanvas");
const ctx = canvas.getContext("2d");
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.onresize = resizeCanvas;
resizeCanvas();

for (let i = 0; i < 45; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2.5 + 1,
    dx: (Math.random() - 0.5) * 0.4,
    dy: (Math.random() - 0.5) * 0.4,
    alpha: Math.random() * 0.6 + 0.2
  });
}

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 210, 138, ${p.alpha})`;
    ctx.fill();
    p.x += p.dx; p.y += p.dy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// 初始化加载
applyConfig();
</script>
</body>
</html>
