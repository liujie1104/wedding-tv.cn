<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>婚礼大屏互动系统 · 微信扫码弹幕签到与现场抽奖</title>
<meta name="description" content="免费婚礼大屏互动软件，支持酒店LED投屏、微信扫码发送弹幕、大屏祝福墙、现场照片滚动与幸运抽奖，支持自定义新人姓名、欢迎语与自定义背景图。" />
<link rel="canonical" href="https://wedding-tv.cn/live-wall.html" />
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6560247681968502" crossorigin="anonymous"></script>

<!-- 多 CDN 兜底加载 QRCode 库 -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
if (typeof QRCode === "undefined") {
  document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"><\/script>');
}
</script>

<style>
:root {
  --gold: #ffd28a;
  --rose: #ff6b9d;
  --bg-dark: #0e0a14;
  --panel: rgba(23, 17, 33, 0.92);
  --line: rgba(255, 210, 138, 0.28);
  --text: #f7f3ff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body, html {
  width: 100%; height: 100%; overflow: hidden;
  background: #09060d; color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  user-select: none;
}

/* 背景层 */
#screenBg {
  position: fixed; inset: 0; z-index: 0;
  background-size: cover; background-position: center; background-repeat: no-repeat;
  transition: background-image 0.4s ease;
}
#particleCanvas {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
}

/* 顶部大屏标题栏 */
.top-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  padding: 24px 40px;
  display: flex; justify-content: space-between; align-items: flex-start;
  background: linear-gradient(180deg, rgba(14,10,20,0.88) 0%, rgba(14,10,20,0) 100%);
  text-shadow: 0 2px 12px rgba(0,0,0,0.9);
}
.header-main h1 {
  font-size: 38px; font-weight: 800; color: var(--gold);
  letter-spacing: 1.5px; display: flex; align-items: center; gap: 12px;
}
.header-main .subtitle {
  font-size: 18px; color: #eee4f7; margin-top: 6px; font-weight: 500;
}
.header-meta {
  text-align: right; font-size: 15px; color: var(--gold);
}
.header-meta .date { font-size: 22px; font-weight: 700; color: #fff; }

/* 弹幕主容器 */
#danmakuContainer {
  position: fixed; inset: 130px 0 100px 0; z-index: 5;
  overflow: hidden; pointer-events: none;
}

/* GPU 硬件加速弹幕飞行动画 */
@keyframes flyDanmakuAnim {
  0% { transform: translate3d(100vw, 0, 0); }
  100% { transform: translate3d(-150%, 0, 0); }
}

.danmaku-item {
  position: absolute; left: 0; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 12px;
  padding: 10px 24px; border-radius: 999px;
  font-size: 26px; font-weight: 700;
  box-shadow: 0 6px 24px rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
  animation-name: flyDanmakuAnim;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
  will-change: transform;
}
.danmaku-item .badge {
  font-size: 15px; padding: 4px 12px; border-radius: 999px;
  background: rgba(0,0,0,0.35); font-weight: 600;
}

/* 颜色风格 */
.dm-gold { background: rgba(38, 28, 16, 0.92); color: #ffe6bf; border: 2px solid #ffd28a; }
.dm-rose { background: rgba(48, 18, 32, 0.92); color: #ffdae7; border: 2px solid #ff6b9d; }
.dm-purple { background: rgba(30, 20, 52, 0.92); color: #ebd8ff; border: 2px solid #c4b5fd; }
.dm-red { background: rgba(56, 14, 20, 0.92); color: #ffe6e8; border: 2px solid #f43f5e; }

/* 右下角扫码区域 */
.qr-corner {
  position: fixed; right: 30px; bottom: 25px; z-index: 20;
  background: rgba(23, 17, 33, 0.95); border: 2px solid var(--gold);
  border-radius: 16px; padding: 12px 16px; text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.85);
  display: flex; align-items: center; gap: 14px;
}
.qr-wrap {
  width: 100px; height: 100px; border-radius: 8px; background: #fff; padding: 4px;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.qr-wrap canvas, .qr-wrap img {
  width: 92px; height: 92px; display: block;
}
.qr-info h4 { font-size: 16px; color: var(--gold); margin-bottom: 4px; font-weight: 700; }
.qr-info p { font-size: 12px; color: #b9aed1; line-height: 1.4; }

/* 底部操作控制条 */
.control-bar {
  position: fixed; bottom: 25px; left: 30px; z-index: 20;
  display: flex; gap: 10px;
}
.ctrl-btn {
  background: rgba(23, 17, 33, 0.9); border: 1px solid var(--line);
  color: var(--text); padding: 10px 20px; border-radius: 999px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  backdrop-filter: blur(8px); transition: all 0.2s;
}
.ctrl-btn:hover, .ctrl-btn.active {
  border-color: var(--gold); color: var(--gold); background: rgba(40, 28, 58, 0.98);
  box-shadow: 0 0 14px rgba(255,210,138,0.35);
}

/* 抽奖弹窗模式 */
#lotteryModal {
  display: none; position: fixed; inset: 0; z-index: 50;
  background: rgba(10,6,15,0.92); backdrop-filter: blur(12px);
  align-items: center; justify-content: center; flex-direction: column;
}
.lottery-box {
  width: 580px; background: #171121; border: 2px solid var(--gold);
  border-radius: 24px; padding: 36px; text-align: center;
  box-shadow: 0 15px 50px rgba(0,0,0,0.9);
}
.roller-card {
  height: 120px; background: #0e0a14; border: 1px solid var(--line);
  border-radius: 16px; margin: 24px 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 42px; font-weight: 800; color: var(--gold);
}
.lottery-winners {
  margin-top: 20px; max-height: 140px; overflow-y: auto; text-align: left;
  background: #0e0a14; border-radius: 10px; padding: 12px; font-size: 14px;
}

/* 设置抽屉 */
#settingsDrawer {
  position: fixed; top: 0; left: -440px; bottom: 0; width: 420px; z-index: 100;
  background: #171121; border-right: 1px solid var(--line);
  box-shadow: 10px 0 40px rgba(0,0,0,0.8);
  padding: 26px 22px; overflow-y: auto;
  transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
#settingsDrawer.open { left: 0; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: var(--gold); margin-bottom: 6px; font-weight: 600; }
.form-group input, .form-group select {
  width: 100%; padding: 10px 12px; background: #0e0a14; border: 1px solid var(--line);
  border-radius: 8px; color: #fff; font-size: 14px; outline: none;
}
.form-group input:focus { border-color: var(--gold); }
.preset-bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.preset-bg-btn {
  padding: 10px 6px; border-radius: 8px; border: 1px solid var(--line);
  background: #0e0a14; color: #e2d9eb; font-size: 12px; cursor: pointer; text-align: center;
}
.preset-bg-btn.active { border-color: var(--gold); color: var(--gold); background: #261933; font-weight: bold; }

/* 提示气泡 */
#toastBox {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999;
  background: rgba(30, 20, 45, 0.96); border: 1.5px solid var(--gold); color: var(--gold);
  padding: 12px 28px; border-radius: 999px; font-size: 15px; font-weight: 700;
  display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.85);
}
</style>
</head>
<body>

<div id="toastBox">✅ 设置已生效并保存！</div>

<!-- 动态背景 -->
<div id="screenBg"></div>
<canvas id="particleCanvas"></canvas>

<!-- 顶部大屏标题 -->
<header class="top-header">
  <div class="header-main">
    <h1 id="dispTitle">🤵 <span id="dispGroom">张明</span> & 👰 <span id="dispBride">李婷</span> · 婚礼互动大屏</h1>
    <div class="subtitle" id="dispSubtitle">欢迎各位亲朋好友莅临见证 · 微信扫码发弹幕送祝福</div>
  </div>
  <div class="header-meta">
    <div class="date" id="dispDate">2026.08.28</div>
    <div id="dispVenue">喜来登大酒店 · 凡尔赛宴会厅</div>
  </div>
</header>

<!-- 弹幕飞行主轨道 -->
<div id="danmakuContainer"></div>

<!-- 右下角常驻互动二维码 -->
<div class="qr-corner" id="qrBox">
  <div class="qr-wrap">
    <canvas id="qrCanvas"></canvas>
    <img id="qrImgFallback" style="display:none;" alt="互动二维码" />
  </div>
  <div class="qr-info">
    <h4>📱 微信扫码</h4>
    <p>现场发弹幕 / 签到</p>
    <p style="color:var(--rose);margin-top:2px;font-weight:bold;">实时飞越大屏</p>
  </div>
</div>

<!-- 底部控制按钮 -->
<div class="control-bar">
  <button class="ctrl-btn" id="btnSettings">⚙️ 大屏设置 (S)</button>
  <button class="ctrl-btn" id="btnDemo">🎲 模拟弹幕</button>
  <button class="ctrl-btn" id="btnLottery">🎁 现场抽奖</button>
  <button class="ctrl-btn" id="btnFullscreen">🖥️ 全屏展示 (F11)</button>
  <button class="ctrl-btn" id="btnClear">🧹 清屏</button>
</div>

<!-- 抽奖弹窗 -->
<div id="lotteryModal">
  <div class="lottery-box">
    <h2 style="color:var(--gold);font-size:28px;">🎁 现场大屏幸运抽奖</h2>
    <p style="color:#b9aed1;font-size:14px;margin-top:6px;">从所有扫码发送祝福的宾客中随机抽取</p>
    <div class="roller-card" id="lotteryRoller">准备抽奖...</div>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button class="ctrl-btn active" id="btnStartLottery" style="padding:12px 32px;font-size:16px;">▶️ 开始滚动 (空格)</button>
      <button class="ctrl-btn" id="btnCloseLottery" style="padding:12px 24px;">✕ 关闭</button>
    </div>
    <div class="lottery-winners" id="lotteryWinnerList">中奖名单：暂无</div>
  </div>
</div>

<!-- 设置侧边栏 -->
<div id="settingsDrawer">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
    <h3 style="color:var(--gold);font-size:18px;">⚙️ 婚礼大屏设置</h3>
    <button id="btnCloseSettings" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;">✕</button>
  </div>

  <div class="form-group">
    <label>房间代号 (Room ID)</label>
    <input type="text" id="cfgRoom" value="wedding888" placeholder="用于宾客扫码关联" />
  </div>

  <div class="form-group">
    <label>新人姓名</label>
    <div style="display:flex;gap:8px;">
      <input type="text" id="cfgGroom" placeholder="新郎" value="张明" />
      <input type="text" id="cfgBride" placeholder="新娘" value="李婷" />
    </div>
  </div>

  <div class="form-group">
    <label>主标题 & 欢迎副标题</label>
    <input type="text" id="cfgTitle" value="婚礼现场大屏互动" style="margin-bottom:8px;" />
    <input type="text" id="cfgSubtitle" value="欢迎各位亲朋好友莅临见证 · 微信扫码发弹幕送祝福" />
  </div>

  <div class="form-group">
    <label>婚期 & 宴会场地</label>
    <input type="text" id="cfgDate" value="2026.08.28" style="margin-bottom:8px;" />
    <input type="text" id="cfgVenue" value="喜来登大酒店 · 凡尔赛宴会厅" />
  </div>

  <div class="form-group">
    <label>大屏背景主题</label>
    <div class="preset-bg-grid">
      <div class="preset-bg-btn active" data-bg="midnight">🌌 星河黑金</div>
      <div class="preset-bg-btn" data-bg="rose">🌸 浪漫樱粉</div>
      <div class="preset-bg-btn" data-bg="champagne">✨ 香槟优雅</div>
    </div>
  </div>

  <div class="form-group">
    <label>🖼️ 自定义上传大屏背景图 (婚纱照/现场海报)</label>
    <input type="file" id="cfgCustomBg" accept="image/*" />
    <small style="color:#b9aed1;font-size:11px;display:block;margin-top:4px;">支持任意高清横版婚纱照或酒店舞台海报</small>
  </div>

  <div class="form-group">
    <label>弹幕飞行速度</label>
    <select id="cfgSpeed">
      <option value="12">慢速（从容悠闲）</option>
      <option value="8" selected>中速（标准推荐）</option>
      <option value="5">快速（欢快热闹）</option>
    </select>
  </div>

  <button class="ctrl-btn active" id="btnSaveCfg" style="width:100%;justify-content:center;margin-top:14px;padding:12px;font-size:15px;">💾 保存并应用设置</button>
</div>

<script>
const $ = id => document.getElementById(id);

// 状态配置
let config = {
  room: "wedding888",
  groom: "张明",
  bride: "李婷",
  title: "婚礼现场大屏互动",
  subtitle: "欢迎各位亲朋好友莅临见证 · 微信扫码发弹幕送祝福",
  date: "2026.08.28",
  venue: "喜来登大酒店 · 凡尔赛宴会厅",
  bgTheme: "midnight",
  speed: 8
};

let currentCustomBgUrl = "";

// 预设背景
const BG_PRESETS = {
  midnight: "radial-gradient(circle at center, #261633 0%, #150d1e 60%, #09060d 100%)",
  rose: "radial-gradient(circle at center, #3d1727 0%, #240c17 60%, #12050b 100%)",
  champagne: "radial-gradient(circle at center, #302414 0%, #1f160b 60%, #0d0904 100%)"
};

// 立即读取本地存储
try {
  const saved = localStorage.getItem("wedding_wall_cfg_v3");
  if (saved) {
    config = { ...config, ...JSON.parse(saved) };
  }
} catch(e){}

// 同步到表单
function syncInputs() {
  $("cfgRoom").value = config.room || "wedding888";
  $("cfgGroom").value = config.groom || "张明";
  $("cfgBride").value = config.bride || "李婷";
  $("cfgTitle").value = config.title || "婚礼现场大屏互动";
  $("cfgSubtitle").value = config.subtitle || "";
  $("cfgDate").value = config.date || "2026.08.28";
  $("cfgVenue").value = config.venue || "";
  $("cfgSpeed").value = config.speed || 8;

  document.querySelectorAll(".preset-bg-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.bg === config.bgTheme);
  });
}

function showToast(msg) {
  const t = $("toastBox");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 2500);
}

function applyConfig() {
  $("dispGroom").textContent = config.groom;
  $("dispBride").textContent = config.bride;
  $("dispTitle").innerHTML = `🤵 <span>${escapeHtml(config.groom)}</span> & 👰 <span>${escapeHtml(config.bride)}</span> · ${escapeHtml(config.title)}`;
  $("dispSubtitle").textContent = config.subtitle;
  $("dispDate").textContent = config.date;
  $("dispVenue").textContent = config.venue;

  // 渲染背景
  if (currentCustomBgUrl) {
    $("screenBg").style.backgroundImage = `linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)), url("${currentCustomBgUrl}")`;
    $("screenBg").style.backgroundSize = "cover";
    $("screenBg").style.backgroundPosition = "center";
  } else {
    $("screenBg").style.backgroundImage = BG_PRESETS[config.bgTheme] || BG_PRESETS.midnight;
  }

  // 渲染二维码
  renderQRCode();
}

function renderQRCode() {
  const joinUrl = `https://wedding-tv.cn/blessing.html?room=${encodeURIComponent(config.room)}&g=${encodeURIComponent(config.groom)}&b=${encodeURIComponent(config.bride)}`;
  
  if (typeof QRCode !== "undefined" && QRCode.toCanvas) {
    QRCode.toCanvas($("qrCanvas"), joinUrl, {
      width: 92, margin: 0, color: { dark: "#0e0a14", light: "#ffffff" }
    }, (err) => {
      if (err) fallbackQR(joinUrl);
    });
  } else {
    fallbackQR(joinUrl);
  }
}

function fallbackQR(url) {
  const img = $("qrImgFallback");
  img.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&margin=1&data=${encodeURIComponent(url)}`;
  img.style.display = "block";
  $("qrCanvas").style.display = "none";
}

// 弹幕系统
const container = $("danmakuContainer");
const trackCount = 6;
let guestPool = new Set(["张明", "李婷"]);
let danmakuQueue = [];
let queueTimer = null;

function enqueueDanmaku(item) {
  danmakuQueue.push(item);
  if (!queueTimer) {
    // 立即发第一个
    processQueue();
    queueTimer = setInterval(processQueue, 750);
  }
}

function processQueue() {
  if (danmakuQueue.length > 0) {
    const next = danmakuQueue.shift();
    spawnDanmaku(next.name, next.identity, next.message, next.color);
  } else {
    clearInterval(queueTimer);
    queueTimer = null;
  }
}

function spawnDanmaku(name, identity, message, color = "gold") {
  guestPool.add(name);
  const el = document.createElement("div");
  const colorClass = `dm-${color || "gold"}`;
  el.className = `danmaku-item ${colorClass}`;
  el.innerHTML = `<span class="badge">${escapeHtml(identity || "现场宾客")} · ${escapeHtml(name)}</span> <span>${escapeHtml(message)}</span>`;
  
  const trackIdx = Math.floor(Math.random() * trackCount);
  const trackH = container.clientHeight / trackCount;
  const topY = Math.max(10, trackIdx * trackH + (trackH * 0.1));
  el.style.top = topY + "px";
  el.style.animationDuration = (config.speed || 8) + "s";
  
  el.addEventListener("animationend", () => el.remove());
  container.appendChild(el);
}

function escapeHtml(str) {
  return String(str || "").replace(/[&<>"']/g, m => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}

// 实时轮询 /api/load?wall=room&since=timestamp
let lastTimestamp = Date.now() - 3600000;
let seenMsgIds = new Set();

async function pollMessages() {
  try {
    const res = await fetch(`/api/load?wall=${encodeURIComponent(config.room)}&since=${lastTimestamp}`);
    const data = await res.json();
    if (data && data.ok && data.messages && data.messages.length > 0) {
      data.messages.forEach(msg => {
        if (!seenMsgIds.has(msg.id)) {
          seenMsgIds.add(msg.id);
          enqueueDanmaku(msg);
        }
        if (msg.ts > lastTimestamp) lastTimestamp = msg.ts;
      });
    }
  } catch(e){}
}
setInterval(pollMessages, 1800);

// 模拟演示弹幕
const DEMO_POOL = [
  { name: "王伟", iden: "大学室友 · 6号桌", text: "祝老铁新婚快乐，百年好合！早生贵子！🎉", col: "gold" },
  { name: "林晓雨", iden: "新娘闺蜜 · 2号桌", text: "最美的新娘！婷婷今天美翻全场，要永远幸福下去呀！❤️", col: "rose" },
  { name: "张叔叔", iden: "长辈亲友 · 1号桌", text: "两姓联姻，一堂缔约，祝新人永结同心，福泽深厚！✨", col: "gold" },
  { name: "刘鹏", iden: "伴郎团 · 8号桌", text: "新郎今晚千万别喝趴下，兄弟们顶得住！🍻", col: "purple" },
  { name: "赵雅婷", iden: "同事好友 · 5号桌", text: "从校园长跑到步入婚姻殿堂，见证神仙爱情，太感动了！😭", col: "rose" },
  { name: "陈浩", iden: "高中同学 · 7号桌", text: "恭喜老同学抱得美人归！喜酒真好喝！🥂", col: "red" }
];

let demoTimer = null;
$("btnDemo").onclick = () => {
  if (demoTimer) {
    clearInterval(demoTimer); demoTimer = null;
    $("btnDemo").textContent = "🎲 模拟弹幕";
    $("btnDemo").classList.remove("active");
  } else {
    $("btnDemo").textContent = "⏹️ 停止模拟";
    $("btnDemo").classList.add("active");
    let idx = 0;
    demoTimer = setInterval(() => {
      const item = DEMO_POOL[idx % DEMO_POOL.length];
      enqueueDanmaku({ name: item.name, identity: item.iden, message: item.text, color: item.col, id: "demo_" + Date.now() });
      idx++;
    }, 1200);
  }
};

// 抽奖逻辑
let lotteryRolling = false;
let lotteryInterval = null;
$("btnLottery").onclick = () => { $("lotteryModal").style.display = "flex"; };
$("btnCloseLottery").onclick = () => { $("lotteryModal").style.display = "none"; };

function toggleLottery() {
  const pool = Array.from(guestPool);
  if (pool.length === 0) pool.push("现场贵宾");

  if (!lotteryRolling) {
    lotteryRolling = true;
    $("btnStartLottery").textContent = "⏹️ 停止抽取中奖者";
    lotteryInterval = setInterval(() => {
      const r = pool[Math.floor(Math.random() * pool.length)];
      $("lotteryRoller").textContent = `🎉 ${r} 🎉`;
    }, 60);
  } else {
    lotteryRolling = false;
    clearInterval(lotteryInterval);
    $("btnStartLottery").textContent = "▶️ 再抽一位";
    const winner = $("lotteryRoller").textContent.replace(/🎉/g, "").trim();
    const item = document.createElement("div");
    item.style.padding = "4px 0";
    item.innerHTML = `🏆 <strong style="color:var(--gold)">${winner}</strong> 荣获幸运大礼！ (${new Date().toLocaleTimeString()})`;
    $("lotteryWinnerList").appendChild(item);
  }
}
$("btnStartLottery").onclick = toggleLottery;

// 设置抽屉交互
$("btnSettings").onclick = () => {
  syncInputs();
  $("settingsDrawer").classList.add("open");
};
$("btnCloseSettings").onclick = () => { $("settingsDrawer").classList.remove("open"); };

document.querySelectorAll(".preset-bg-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".preset-bg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    config.bgTheme = btn.dataset.bg;
    currentCustomBgUrl = "";
    applyConfig();
  };
});

$("cfgCustomBg").onchange = (e) => {
  const file = e.target.files[0];
  if (file) {
    currentCustomBgUrl = URL.createObjectURL(file);
    document.querySelectorAll(".preset-bg-btn").forEach(b => b.classList.remove("active"));
    applyConfig();
    showToast("🖼️ 自定义图片已实时应用！");
  }
};

// 实时输入监听预览
["cfgGroom", "cfgBride", "cfgTitle", "cfgSubtitle", "cfgDate", "cfgVenue"].forEach(id => {
  $(id).addEventListener("input", () => {
    config.room = $("cfgRoom").value.trim() || "wedding888";
    config.groom = $("cfgGroom").value.trim() || "张明";
    config.bride = $("cfgBride").value.trim() || "李婷";
    config.title = $("cfgTitle").value.trim() || "婚礼现场大屏互动";
    config.subtitle = $("cfgSubtitle").value.trim();
    config.date = $("cfgDate").value.trim();
    config.venue = $("cfgVenue").value.trim();
    applyConfig();
  });
});

$("btnSaveCfg").onclick = () => {
  config.room = $("cfgRoom").value.trim() || "wedding888";
  config.groom = $("cfgGroom").value.trim() || "张明";
  config.bride = $("cfgBride").value.trim() || "李婷";
  config.title = $("cfgTitle").value.trim() || "婚礼现场大屏互动";
  config.subtitle = $("cfgSubtitle").value.trim();
  config.date = $("cfgDate").value.trim();
  config.venue = $("cfgVenue").value.trim();
  config.speed = Number($("cfgSpeed").value) || 8;

  try {
    localStorage.setItem("wedding_wall_cfg_v3", JSON.stringify(config));
  } catch(e){}

  applyConfig();
  $("settingsDrawer").classList.remove("open");
  showToast("✅ 设置已生效并保存！");
  
  // 重置时间戳重新拉取当前房间消息
  lastTimestamp = Date.now() - 3600000;
  seenMsgIds.clear();
  pollMessages();
};

// 全屏与清屏
$("btnFullscreen").onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
};
$("btnClear").onclick = () => { container.innerHTML = ""; };

// 快捷键
window.addEventListener("keydown", (e) => {
  if (e.key === "s" || e.key === "S") {
    syncInputs();
    $("settingsDrawer").classList.toggle("open");
  }
  if (e.key === " " && $("lotteryModal").style.display === "flex") {
    e.preventDefault(); toggleLottery();
  }
});

// 星空粒子背景
const canvas = $("particleCanvas");
const ctx = canvas.getContext("2d");
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.onresize = resizeCanvas;
resizeCanvas();

for (let i = 0; i < 45; i++) {
  particles.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 2.5 + 1,
    dx: (Math.random() - 0.5) * 0.4,
    dy: (Math.random() - 0.5) * 0.4,
    alpha: Math.random() * 0.6 + 0.2
  });
}

function drawParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 210, 138, ${p.alpha})`;
    ctx.fill();
    p.x += p.dx; p.y += p.dy;
    if (p.x < 0) p.x = canvas.width;
    if (p.x > canvas.width) p.x = 0;
    if (p.y < 0) p.y = canvas.height;
    if (p.y > canvas.height) p.y = 0;
  });
  requestAnimationFrame(drawParticles);
}
drawParticles();

// 初始化载入
syncInputs();
applyConfig();
pollMessages();
window.addEventListener("load", renderQRCode);
</script>
